# LEGACY FILE - kept only so a customer board still running the retired duranc_gw_rasp_pi_5 installer
# does not break on re-run. The ':pi5' tag it used no longer exists (one linux/arm64 image
# now serves Pi 4 and Pi 5) and /persistent was missing. New installs use
# doc-comp-gw-rasp-pi{,-prod,-nas}.yml instead.
version: "3"
services:
  gateway:
    image: index.docker.io/durancai/production-gateway-rasp-pi:latest
    container_name: duranc_gateway
    restart: unless-stopped
    shm_size: "4gb"
    volumes:
      - gateway:/root/.duranc:rw
      - motion:/root/.motion:rw
      - gateway:/persistent:rw
    network_mode: host
    privileged: true
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    command: /usr/bin/supervisord

  autoupdater:
    image: containrrr/watchtower
    container_name: duranc_autoupdater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/auth.json:/config.json:ro
    ports:
      - 9080:8080
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    command: watchtower duranc_gateway --schedule "0 0 0 * * *" --cleanup --debug

volumes:
  gateway:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /local-storage/gw-files/
  motion:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /local-storage/motion-files/

