#CONF_VERSION=005
writeQueueSize: 4096
api: yes
apiAddress: 127.0.0.1:9997
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: apiuser
    pass: PASSWORD_PLACEHOLDER
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof
rtsp: yes
rtspTransports: [tcp]
rtspAddress: :38554
rtpAddress: :38000
rtcpAddress: :38001
rtspAuthMethods: [basic]
rtmp: no
hlsVariant: mpegts
webrtc: no
hls: no
